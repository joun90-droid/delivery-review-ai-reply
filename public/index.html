<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#191f28">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>리뷰 답글 AI · 매장 대시보드</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    :root {
      --bg: #f2f4f6;
      --card: #fff;
      --text: #191f28;
      --sub: #8b95a1;
      --line: #e5e8eb;
      --blue: #3182f6;
      --soft: #e8f3ff;
      --ok: #00c471;
      --baemin: #2ac1bc;
      --coupang: #3478f6;
      --yogiyo: #fa0050;
      --ddangyo: #ff7a00;
      --special: #7b61ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
    }
    .topbar {
      position: sticky; top: 0; z-index: 20;
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      padding: 12px 16px; padding-left: max(16px, env(safe-area-inset-left));
      padding-right: max(16px, env(safe-area-inset-right));
      background: rgba(255,255,255,.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .logo {
      width: 36px; height: 36px; border-radius: 10px;
      background: linear-gradient(160deg, #4b8bff, #3182f6);
      color: #fff; display: grid; place-items: center;
    }
    .brand strong { font-size: 15px; display: block; }
    .brand span { font-size: 11px; color: var(--sub); }
    .topbar .right { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    select, input, textarea, button { font: inherit; }
    .store-select, .field {
      border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 8px 10px; color: var(--text);
    }
    .badge {
      font-size: 11px; font-weight: 700; padding: 6px 10px; border-radius: 999px;
      background: #e8fff4; color: var(--ok);
    }
    .wrap {
      max-width: 1280px; margin: 0 auto;
      padding: 16px; padding-bottom: calc(24px + env(safe-area-inset-bottom));
      display: grid; grid-template-columns: 1fr; gap: 14px;
    }
    @media (min-width: 960px) {
      .wrap { grid-template-columns: minmax(320px, 440px) minmax(0, 1fr); align-items: start; }
    }
    .panel {
      background: var(--card); border-radius: 18px; padding: 16px;
      box-shadow: 0 1px 2px rgba(0,0,0,.04);
    }
    .panel h2 { font-size: 15px; margin-bottom: 12px; }
    .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .ptab {
      border: 0; border-radius: 999px; padding: 7px 10px; font-size: 12px; font-weight: 700;
      background: #f2f4f6; color: var(--text); cursor: pointer;
    }
    .ptab.active { color: #fff; }
    .stars { display: flex; gap: 6px; flex-wrap: wrap; }
    .star {
      width: 40px; height: 40px; border: 0; border-radius: 10px; background: #f2f4f6;
      font-size: 16px; cursor: pointer;
    }
    .star.on { background: #fff4e5; }
    label.lbl { display: block; font-size: 12px; font-weight: 600; color: var(--sub); margin: 12px 0 6px; }
    .grid2 { display: grid; grid-template-columns: 1fr; gap: 8px; }
    @media (min-width: 520px) { .grid2 { grid-template-columns: 1fr 1fr; } }
    .field, textarea.field { width: 100%; font-size: 16px; }
    textarea.field { min-height: 120px; resize: vertical; line-height: 1.5; }
    .fold > summary {
      list-style: none; cursor: pointer; font-weight: 700; font-size: 14px; padding: 4px 0 10px;
    }
    .fold > summary::-webkit-details-marker { display: none; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 8px 0; }
    .switch { position: relative; width: 42px; height: 24px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .knob { position: absolute; inset: 0; background: #d1d6db; border-radius: 999px; }
    .knob:before { content: ""; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
    .switch input:checked + .knob { background: var(--blue); }
    .switch input:checked + .knob:before { transform: translateX(18px); }
    .tones { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .tone {
      border: 1.5px solid transparent; background: #f2f4f6; border-radius: 12px; padding: 10px; text-align: left; cursor: pointer; font-size: 12px; font-weight: 700;
    }
    .tone.active { background: var(--soft); border-color: var(--blue); }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag {
      border: 0; border-radius: 999px; padding: 6px 10px; font-size: 12px; background: #f2f4f6; cursor: pointer;
    }
    .tag.on { background: var(--soft); color: var(--blue); font-weight: 700; }
    .go {
      width: 100%; margin-top: 14px; border: 0; border-radius: 14px; min-height: 48px;
      background: linear-gradient(135deg, #5b8def, #3182f6); color: #fff; font-weight: 800; cursor: pointer;
    }
    .go:disabled { opacity: .6; }
    .preview-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .cards { display: grid; gap: 12px; }
    .reply {
      border: 1px solid var(--line); border-radius: 16px; padding: 12px; background: #fafbfc;
    }
    .reply h3 { font-size: 13px; color: var(--blue); margin-bottom: 8px; }
    .reply textarea {
      width: 100%; min-height: 110px; border: 0; background: transparent; resize: vertical; line-height: 1.55; font-size: 15px; color: var(--text);
    }
    .meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--sub); margin: 6px 0 8px; }
    .meta.warn { color: #f04452; }
    .actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .actions button {
      flex: 1; min-width: 120px; border: 0; border-radius: 10px; padding: 10px; font-size: 13px; font-weight: 700; cursor: pointer; background: #fff; border: 1px solid var(--line);
    }
    .actions .copy { background: var(--blue); color: #fff; border: 0; }
    .empty { text-align: center; color: var(--sub); padding: 40px 12px; font-size: 14px; }
    .toast {
      position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(12px);
      background: #191f28; color: #fff; padding: 12px 16px; border-radius: 999px; font-size: 13px; font-weight: 700;
      opacity: 0; pointer-events: none; transition: .2s; z-index: 50; max-width: calc(100vw - 24px); text-align: center;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo"><i class="fa-solid fa-store"></i></div>
      <div>
        <strong>리뷰랩</strong>
        <span>사장님 답글 워크스페이스</span>
      </div>
    </div>
    <div class="right">
      <select class="store-select" id="storeSelect" aria-label="매장 선택"></select>
      <span class="badge" id="statusBadge">AI 준비됨</span>
    </div>
  </header>

  <main class="wrap">
    <section class="panel">
      <h2>리뷰 · 매장 설정</h2>
      <div class="tabs" id="platformTabs"></div>
      <label class="lbl">별점</label>
      <div class="stars" id="stars"></div>
      <div class="grid2">
        <div>
          <label class="lbl" for="menu">주문 메뉴 (선택)</label>
          <input class="field" id="menu" placeholder="예: 소세지세트">
        </div>
        <div>
          <label class="lbl" for="nick">고객 닉네임 (선택)</label>
          <input class="field" id="nick" placeholder="예: 배고픈손님">
        </div>
      </div>
      <label class="lbl" for="review">고객 리뷰</label>
      <textarea class="field" id="review" placeholder="손님 리뷰를 붙여넣으세요"></textarea>

      <details class="fold" open>
        <summary>고정 문구 · 매장 정보</summary>
        <label class="lbl" for="storeName">매장명</label>
        <input class="field" id="storeName" placeholder="달떡볶이 파주운정점">
        <div class="row">
          <span>머리말 사용</span>
          <label class="switch"><input type="checkbox" id="headOn" checked><span class="knob"></span></label>
        </div>
        <textarea class="field" id="headerText" style="min-height:64px"></textarea>
        <div class="row">
          <span>꼬리말 사용</span>
          <label class="switch"><input type="checkbox" id="tailOn" checked><span class="knob"></span></label>
        </div>
        <textarea class="field" id="footerText" style="min-height:64px"></textarea>
      </details>

      <label class="lbl">톤앤매너</label>
      <div class="tones" id="tones"></div>
      <label class="lbl">매장 키워드</label>
      <div class="tags" id="tags"></div>
      <button class="go" id="generateBtn" type="button"><i class="fa-solid fa-wand-magic-sparkles"></i> AI 답글 3안 생성</button>
    </section>

    <section class="panel">
      <div class="preview-head">
        <h2>생성 답글 미리보기</h2>
        <span style="font-size:12px;color:var(--sub)" id="limitHint">권장 400자 이내</span>
      </div>
      <div class="cards" id="cards">
        <p class="empty">별점·리뷰를 넣고 생성하면 여기에서 바로 고치고 복사할 수 있습니다.</p>
      </div>
    </section>
  </main>
  <div class="toast" id="toast"></div>
  <script src="gemini-config.js"></script>
  <script>
    const DEFAULT_GEMINI_KEY = window.REVIEWLAB_GEMINI_KEY || '';
    const LS = 'reviewlab.v2';
    const LIMIT = 400;
    const PLATS = [
      { key: 'baemin', name: '배달의민족', color: 'var(--baemin)' },
      { key: 'coupang', name: '쿠팡이츠', color: 'var(--coupang)' },
      { key: 'yogiyo', name: '요기요', color: 'var(--yogiyo)' },
      { key: 'ddangyo', name: '땡겨요', color: 'var(--ddangyo)' },
      { key: 'special', name: '배달특급', color: 'var(--special)' }
    ];
    const TONES = [
      { key: 'kind', label: '다정다감 사장님', prompt: '다정하고 따뜻한 사장님. 공감과 고마움을 살갑게.' },
      { key: 'polite', label: '깔끔·정중형', prompt: '군더더기 없는 정중한 사장님. 이모지 최소화.' },
      { key: 'witty', label: '유쾌·위트형', prompt: '가볍고 유쾌하되 가볍지 않은 위트. 과한 개그 금지.' },
      { key: 'firm', label: '악플·불만 단호 대응', prompt: '감정 싸움 없이 사실·사과·개선을 단호하고 차분하게.' },
      { key: 'short', label: '초간단 1줄', prompt: '한 문장만. 인사와 핵심만.' }
    ];
    const TAGS = ['#국내산고춧가루', '#비법육수', '#푸짐한양', '#배달지연사과', '#리뷰이벤트', '#재주문감사'];
    const $ = (id) => document.getElementById(id);

    const state = {
      platform: 'baemin',
      star: 5,
      tone: 'kind',
      tags: [],
      stores: ['기본 매장'],
      store: '기본 매장',
      options: []
    };

    function load() {
      try { return JSON.parse(localStorage.getItem(LS) || '{}'); } catch { return {}; }
    }
    function save() {
      const data = {
        storeName: $('storeName').value,
        headerText: $('headerText').value,
        footerText: $('footerText').value,
        headOn: $('headOn').checked,
        tailOn: $('tailOn').checked,
        tone: state.tone,
        platform: state.platform,
        stores: state.stores,
        store: $('storeSelect').value
      };
      localStorage.setItem(LS, JSON.stringify(data));
    }
    function toast(msg) {
      const el = $('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.classList.remove('show'), 2000);
    }
    function starStrategy(n) {
      if (n <= 2) return '1~2점 불만. 진심 어린 사과, 개선 약속, 필요 시 보상·연락 안내. 재주문 강요 금지.';
      if (n === 3) return '아쉬운 점과 좋은 점을 균형. 짧은 사과와 감사.';
      return '4~5점 칭찬. 감사와 재주문·단골 유도.';
    }
    function wrapFixed(body) {
      const name = $('storeName').value.trim() || '저희 매장';
      let out = body.trim();
      if ($('headOn').checked) {
        const h = ($('headerText').value || '').split('[매장명]').join(name).trim();
        if (h) out = h + '\n' + out;
      }
      if ($('tailOn').checked) {
        const f = ($('footerText').value || '').split('[매장명]').join(name).trim();
        if (f) out = out + '\n' + f;
      }
      return out;
    }

    function renderPlatforms() {
      $('platformTabs').innerHTML = PLATS.map((p) =>
        `<button type="button" class="ptab ${p.key === state.platform ? 'active' : ''}" data-k="${p.key}" style="${p.key === state.platform ? 'background:' + p.color : ''}">${p.name}</button>`
      ).join('');
      $('platformTabs').onclick = (e) => {
        const b = e.target.closest('.ptab');
        if (!b) return;
        state.platform = b.dataset.k;
        renderPlatforms();
        save();
      };
    }
    function renderStars() {
      $('stars').innerHTML = [1,2,3,4,5].map((n) =>
        `<button type="button" class="star ${n <= state.star ? 'on' : ''}" data-n="${n}">${'★'.repeat(n)}</button>`
      ).join('');
      $('stars').onclick = (e) => {
        const b = e.target.closest('.star');
        if (!b) return;
        state.star = Number(b.dataset.n);
        renderStars();
      };
    }
    function renderTones() {
      $('tones').innerHTML = TONES.map((t) =>
        `<button type="button" class="tone ${t.key === state.tone ? 'active' : ''}" data-k="${t.key}">${t.label}</button>`
      ).join('');
      $('tones').onclick = (e) => {
        const b = e.target.closest('.tone');
        if (!b) return;
        state.tone = b.dataset.k;
        renderTones();
        save();
      };
    }
    function renderTags() {
      $('tags').innerHTML = TAGS.map((t) =>
        `<button type="button" class="tag ${state.tags.includes(t) ? 'on' : ''}">${t}</button>`
      ).join('');
      $('tags').onclick = (e) => {
        const b = e.target.closest('.tag');
        if (!b) return;
        const t = b.textContent;
        state.tags = state.tags.includes(t) ? state.tags.filter((x) => x !== t) : state.tags.concat(t);
        renderTags();
      };
    }
    function renderStores() {
      const sel = $('storeSelect');
      const name = $('storeName').value.trim();
      if (name && !state.stores.includes(name)) state.stores.push(name);
      sel.innerHTML = state.stores.map((s) => `<option ${s === state.store ? 'selected' : ''}>${s}</option>`).join('');
    }
    function renderCards() {
      if (!state.options.length) {
        $('cards').innerHTML = '<p class="empty">별점·리뷰를 넣고 생성하면 여기에서 바로 고치고 복사할 수 있습니다.</p>';
        return;
      }
      const titles = ['옵션 1 · 공감형', '옵션 2 · 핵심형', '옵션 3 · 여유형'];
      $('cards').innerHTML = state.options.map((text, i) => {
        const n = text.length;
        return `<article class="reply" data-i="${i}">
          <h3>${titles[i]}</h3>
          <textarea class="edit">${text.replace(/</g, '&lt;')}</textarea>
          <div class="meta ${n > LIMIT ? 'warn' : ''}"><span>${n} / ${LIMIT}자</span><span>${n > LIMIT ? '글자수 초과 · 줄여주세요' : '플랫폼 붙여넣기 가능'}</span></div>
          <div class="actions">
            <button type="button" class="copy">원클릭 복사</button>
            <button type="button" class="redo">이 톤으로 재생성</button>
          </div>
        </article>`;
      }).join('');
      $('cards').querySelectorAll('.reply').forEach((card) => {
        const i = Number(card.dataset.i);
        const ta = card.querySelector('.edit');
        const meta = card.querySelector('.meta');
        ta.addEventListener('input', () => {
          state.options[i] = ta.value;
          const n = ta.value.length;
          meta.classList.toggle('warn', n > LIMIT);
          meta.innerHTML = `<span>${n} / ${LIMIT}자</span><span>${n > LIMIT ? '글자수 초과 · 줄여주세요' : '플랫폼 붙여넣기 가능'}</span>`;
        });
        card.querySelector('.copy').addEventListener('click', async () => {
          try { await navigator.clipboard.writeText(ta.value); }
          catch {
            ta.select(); document.execCommand('copy');
          }
          toast('복사 완료! 배달앱에 붙여넣기 하세요');
        });
        card.querySelector('.redo').addEventListener('click', () => generate(i));
      });
    }

    function parseOptions(text) {
      const found = {};
      ['OPTION_1', 'OPTION_2', 'OPTION_3'].forEach((tag) => {
        const m = text.match(new RegExp('\\[' + tag + '\\]\\s*([\\s\\S]*?)(?=\\[OPTION_|$)'));
        if (m) found[tag] = m[1].trim();
      });
      if (Object.keys(found).length === 3) return [found.OPTION_1, found.OPTION_2, found.OPTION_3].map(wrapFixed);
      const parts = text.split(/\n{2,}/).map((s) => s.replace(/^\[OPTION_\d\]\s*/, '').trim()).filter(Boolean);
      while (parts.length < 3) parts.push(text.trim());
      return parts.slice(0, 3).map(wrapFixed);
    }

    async function generate(onlyIndex) {
      if (!DEFAULT_GEMINI_KEY) { toast('Gemini 설정 파일이 없습니다'); return; }
      const review = $('review').value.trim();
      if (!review) { toast('손님 리뷰를 붙여넣으세요'); return; }
      const btn = $('generateBtn');
      btn.disabled = true;
      $('statusBadge').textContent = '생성 중';
      const tone = TONES.find((t) => t.key === state.tone);
      const plat = PLATS.find((p) => p.key === state.platform);
      const prompt = `[역할] ${plat.name} 사장님 답글 작성. 본문만.
[톤] ${tone.prompt}
[별점] ${state.star}점
[전략] ${starStrategy(state.star)}
[매장] ${$('storeName').value || '매장'}
[메뉴] ${$('menu').value || '미기재'}
[닉네임] ${$('nick').value || '미기재'}
[키워드] ${state.tags.join(' ') || '없음'}
[리뷰]
"""
${review}
"""
서로 다른 3안. 머리말/꼬리말은 넣지 말고 본문만.
[OPTION_1]
[OPTION_2]
[OPTION_3]`;
      try {
        const res = await fetch(
          'https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=' + encodeURIComponent(DEFAULT_GEMINI_KEY),
          { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] }) }
        );
        const data = await res.json();
        const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
        if (!text) throw new Error(data?.error?.message || '생성 실패');
        const all = parseOptions(text);
        if (onlyIndex == null) state.options = all;
        else state.options[onlyIndex] = all[onlyIndex] || all[0];
        renderCards();
        toast(onlyIndex == null ? '답글 3안을 만들었어요' : '해당 카드를 다시 만들었어요');
      } catch (err) {
        toast(err.message || '생성에 실패했어요');
      } finally {
        btn.disabled = false;
        $('statusBadge').textContent = 'AI 준비됨';
      }
    }

    (function init() {
      const saved = load();
      $('storeName').value = saved.storeName || '';
      $('headerText').value = saved.headerText || '안녕하세요! 맛있는 행복을 전하는 [매장명]입니다.';
      $('footerText').value = saved.footerText || '❤️ 찜 누르고 리뷰 이벤트 참여 시 다음 주문 요청사항에 적어주세요!';
      $('headOn').checked = saved.headOn !== false;
      $('tailOn').checked = saved.tailOn !== false;
      state.tone = saved.tone || 'kind';
      state.platform = saved.platform || 'baemin';
      state.stores = saved.stores && saved.stores.length ? saved.stores : ['기본 매장'];
      state.store = saved.store || state.stores[0];
      renderPlatforms(); renderStars(); renderTones(); renderTags(); renderStores();
      ['storeName','headerText','footerText','headOn','tailOn'].forEach((id) => {
        $(id).addEventListener('change', () => { renderStores(); save(); });
        $(id).addEventListener('input', save);
      });
      $('storeSelect').addEventListener('change', () => {
        state.store = $('storeSelect').value;
        if (state.store !== '기본 매장') $('storeName').value = state.store;
        save();
      });
      $('storeName').addEventListener('blur', () => {
        const n = $('storeName').value.trim();
        if (n) { state.store = n; if (!state.stores.includes(n)) state.stores.push(n); renderStores(); save(); }
      });
      $('generateBtn').addEventListener('click', () => generate());
    })();
  </script>
</body>
</html>
