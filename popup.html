<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --bg: #f4f5f7;
      --card: #fff;
      --text: #191f28;
      --sub: #8b95a1;
      --blue: #3182f6;
      --blue-soft: #e8f3ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Apple SD Gothic Neo", sans-serif;
      padding: 16px;
    }
    header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .logo {
      width: 36px; height: 36px; border-radius: 11px;
      background: linear-gradient(160deg, #4b8bff, #3182f6);
      color: #fff; display: grid; place-items: center; font-size: 16px;
    }
    h1 { font-size: 15px; letter-spacing: -0.3px; }
    .sub { font-size: 11px; color: var(--sub); margin-top: 2px; }
    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 8px;
    }
    .label { font-size: 11px; font-weight: 600; color: var(--sub); margin-bottom: 6px; }
    input, textarea {
      width: 100%;
      border: 1px solid transparent;
      background: #f2f4f6;
      border-radius: 10px;
      padding: 10px;
      font: inherit;
      font-size: 13px;
      outline: none;
    }
    input:focus, textarea:focus {
      background: #fff;
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(49, 130, 246, 0.12);
    }
    textarea { height: 72px; resize: none; line-height: 1.4; }
    .tones { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .tone { display: block; cursor: pointer; }
    .tone input { position: absolute; opacity: 0; pointer-events: none; }
    .tone span {
      display: block;
      padding: 9px 8px;
      border-radius: 12px;
      background: #f2f4f6;
      border: 1.5px solid transparent;
      font-size: 12px;
      font-weight: 700;
    }
    .tone small { display: block; font-weight: 500; color: var(--sub); margin-top: 2px; font-size: 10px; }
    .tone input:checked + span {
      background: var(--blue-soft);
      border-color: var(--blue);
    }
    button#saveBtn {
      width: 100%;
      margin-top: 6px;
      border: 0;
      border-radius: 12px;
      padding: 12px;
      background: var(--blue);
      color: #fff;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    #toast {
      position: fixed;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%) translateY(8px);
      background: #191f28;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 999px;
      opacity: 0;
      pointer-events: none;
      transition: 0.2s ease;
      white-space: nowrap;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <header>
    <div class="logo">✦</div>
    <div>
      <h1>배달 리뷰 AI</h1>
      <p class="sub">API 키와 답글 톤을 저장하세요</p>
    </div>
  </header>

  <div class="card">
    <div class="label">Gemini API 키</div>
    <input type="password" id="apiKey" placeholder="API 키 붙여넣기" autocomplete="off">
  </div>

  <div class="card">
    <div class="label">매장 기본 톤앤매너</div>
    <div class="tones">
      <label class="tone">
        <input type="radio" name="replyTone" value="kind">
        <span>친절/감성<small>따뜻한 공감</small></span>
      </label>
      <label class="tone">
        <input type="radio" name="replyTone" value="polite" checked>
        <span>정중/깔끔<small>담백한 사장님</small></span>
      </label>
      <label class="tone">
        <input type="radio" name="replyTone" value="firm">
        <span>악플 단호 대처<small>차분하고 단호</small></span>
      </label>
      <label class="tone">
        <input type="radio" name="replyTone" value="short">
        <span>1줄 초간단<small>한 문장만</small></span>
      </label>
    </div>
  </div>

  <div class="card">
    <div class="label">매장 추가 정보/지침</div>
    <textarea id="prompt" placeholder="예: 떡볶이 맛집, 서비스 음료 언급"></textarea>
  </div>

  <button type="button" id="saveBtn">설정 저장</button>
  <div id="toast">저장 완료</div>
  <script src="popup.js"></script>
</body>
</html>
